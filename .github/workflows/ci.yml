# Runs the checks CONTRIBUTING.md lists on every pull request to main and every push to it, so a
# failure blocks the merge instead of relying on someone to remember them. The Swift and iOS jobs
# build with the oldest Xcode 26 on the runner, the oldest Xcode the package supports
# (docs/CODE_STYLE.md T5).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request or branch replaces a run still under way.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The runner's default Xcode is 16, whose formatter can't read this repository's .swift-format,
      # so the lint uses the current release from Homebrew, as contributors with a newer Xcode do.
      - name: Format lint
        run: |
          brew install swift-format
          swift-format lint --strict --recursive --parallel Sources Tests scripts Package.swift

      - name: Use the oldest Xcode 26
        run: |
          xcode="$(printf '%s\n' /Applications/Xcode_26*.app | grep -v -i beta | sort -V | head -1)"
          if [ ! -d "$xcode" ]; then
            echo "::error::The runner has no Xcode 26."
            exit 1
          fi
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          "$xcode/Contents/Developer/usr/bin/xcodebuild" -version

      - name: Build with warnings as errors
        run: swift build -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test

      - name: Test the Mac tool with the thread sanitizer
        run: swift test --sanitize=thread --filter RedlineToolTests

      # Builds the release `redline` command and the menu bar app around it, into a folder of its
      # own, without opening it.
      - name: Build Redline.app
        run: scripts/build-hub-app.sh "$RUNNER_TEMP/app" --no-start --keep-earlier-app

  ios:
    name: iOS
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The runner image installs the iOS platform for only some of its Xcode versions.
      - name: Use the oldest Xcode 26 that can build for the iOS Simulator
        run: |
          while read -r xcode; do
            [ -d "$xcode" ] || continue
            if DEVELOPER_DIR="$xcode/Contents/Developer" xcodebuild -showdestinations -scheme Redline 2>/dev/null |
              grep "Any iOS Simulator Device" | grep -qv "error:"; then
              echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
              "$xcode/Contents/Developer/usr/bin/xcodebuild" -version
              exit 0
            fi
          done < <(printf '%s\n' /Applications/Xcode_26*.app | grep -v -i beta | sort -V)
          echo "::error::No Xcode 26 on the runner has the iOS platform installed."
          exit 1

      - name: Build the kit in Debug
        run: xcodebuild -scheme Redline -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath .build/xcode build

      - name: Build the kit in Release
        run: xcodebuild -scheme Redline -configuration Release -destination 'generic/platform=iOS Simulator' -derivedDataPath .build/xcode build

      # The kit ships in Debug builds only: the Release object must hold no kit code, no private API
      # name and no path from the machine that built it (docs/CODE_STYLE.md T4).
      - name: Check what each build contains
        run: |
          debug=.build/xcode/Build/Products/Debug-iphonesimulator/Redline.o
          release=.build/xcode/Build/Products/Release-iphonesimulator/Redline.o
          if ! strings -a "$debug" | grep -q AXSSetAutomationEnabled; then
            echo "::error::The Debug build has no AXSSetAutomationEnabled, so the Release check below proves nothing."
            exit 1
          fi
          for text in AXSSetAutomationEnabled DebugSession "$GITHUB_WORKSPACE"; do
            if strings -a "$release" | grep -qF "$text"; then
              echo "::error::The Release build contains $text."
              exit 1
            fi
          done

      - name: Build the documentation with no warnings
        run: |
          set -o pipefail
          xcodebuild docbuild -scheme Redline -destination 'generic/platform=iOS Simulator' -derivedDataPath .build/xcode 2>&1 | tee "$RUNNER_TEMP/docbuild.log"
          if grep -q "warning:" "$RUNNER_TEMP/docbuild.log"; then
            echo "::error::The documentation build has warnings."
            exit 1
          fi

      # The demo app references the kit in this checkout by local path, so this also checks that the
      # kit builds into an app target. A simulator build needs no signing identity, and the runner has
      # none.
      - name: Build the demo app in Debug
        run: xcodebuild -project Examples/RedlineDemo/RedlineDemo.xcodeproj -scheme RedlineDemo -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath .build/demo build CODE_SIGNING_ALLOWED=NO

      # Exercise runtime activation and actual selection, not just compilation of the private adapter.
      - name: Smoke test layout inspection in the demo
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          simulator=$(python3 - "$RUNNER_TEMP/simulators.json" <<'PY'
          import json, sys
          with open(sys.argv[1]) as source:
              devices = json.load(source)["devices"]
          runtimes = sorted(
              (tuple(map(int, runtime.rsplit("iOS-", 1)[1].split("-"))), runtime)
              for runtime in devices if ".iOS-" in runtime
          )
          for version, runtime in runtimes:
              if version[0] < 26:
                  continue
              for device in devices[runtime]:
                  if device["isAvailable"] and device["name"].startswith("iPhone"):
                      print(device["udid"])
                      sys.exit(0)
          sys.exit("No available iPhone simulator running iOS 26 or later")
          PY
          )
          xcodebuild -project Examples/RedlineDemo/RedlineDemo.xcodeproj -scheme RedlineDemo -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator" -derivedDataPath .build/demo \
            -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 \
            -only-testing:RedlineDemoUITests/LayoutPrototypeTests/testLayoutTabOnNormalLaunch \
            -only-testing:RedlineDemoUITests/LayoutPrototypeTests/testPlainButtonLayoutInspection \
            -only-testing:RedlineDemoUITests/LayoutPrototypeTests/testLocalizedTextLayoutInspection \
            -collect-test-diagnostics never test CODE_SIGNING_ALLOWED=NO

  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      # Warnings and errors only: info notes differ between shellcheck versions.
      - name: Check the installer
        run: shellcheck --severity=warning install.sh

      - name: Check the npm entry point
        run: node --check bin/agent-redline-ios.js

      - name: Check that the version agrees everywhere
        run: |
          package="$(node -p "require('./package.json').version")"
          command="$(sed -n 's/^let version = "\(.*\)"$/\1/p' Sources/RedlineTool/main.swift)"
          app="$(sed -n 's/^version="\(.*\)"$/\1/p' scripts/build-hub-app.sh)"
          if [ "$package" != "$command" ] || [ "$package" != "$app" ]; then
            echo "::error::package.json says $package, Sources/RedlineTool/main.swift says $command, scripts/build-hub-app.sh says $app."
            exit 1
          fi

      - name: Check whitespace in the change
        if: github.event_name == 'pull_request'
        run: git diff --check "origin/$GITHUB_BASE_REF...HEAD"
