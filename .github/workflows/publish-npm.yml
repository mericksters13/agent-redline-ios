# Publishes the npm package agent-redline-ios when a GitHub release is published, through npm
# trusted publishing: npm trusts this workflow, so no npm token is stored anywhere, and npm adds a
# provenance record that ties the package to this repository and commit. It's set up once on
# npmjs.com, in the package's Settings under Trusted Publisher (GitHub Actions, this repository,
# and this workflow file). The release tag must match package.json's version, as 0.1.1 or v0.1.1.
name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Use an npm that supports trusted publishing
        run: npm install --global npm@^11.5.1

      - name: Check that the release tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::The release tag $TAG doesn't match package.json's version $version."
            exit 1
          fi

      - name: Publish
        run: npm publish --access public
