  <circle cx="70" cy="464" r="14" fill="#FF3B30" stroke="#FFFFFF" stroke-width="2.5"/>
  <text x="70" y="469.6" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
