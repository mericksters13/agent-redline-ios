  <rect x="70" y="464" width="220" height="64" rx="18" fill="none" stroke="#FFFFFF" stroke-width="7"/>
  <rect x="70" y="464" width="220" height="64" rx="18" fill="none" stroke="#FF3B30" stroke-width="4"/>
