<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">Redline: a note on the phone arrives in the chat</title>
  <desc id="d">An iPhone running a notes app in Redline&#39;s annotate mode, with the Save button outlined in red and numbered 1 and the Title field numbered 2. An arrow runs through the Redline menu bar app on the Mac to a Claude Code or Codex chat, which shows the report it received: the screenshot with the same two red outlines (attached in Codex, read from its inbox path in Claude Code), then note 1, Save (Button, editor.save): The button sits under the keyboard on small phones, and note 2, Title (Text field, editor.title): Placeholder is hard to read in dark mode.</desc>
  <rect x="0" y="0" width="1200" height="620" rx="24" fill="#F2F2F7"/>
  <!-- Phone in annotate mode -->
  <rect x="45" y="45" width="270" height="530" rx="51" fill="#FFFFFF"/>
  <rect x="40" y="40" width="280" height="540" rx="56" fill="none" stroke="#000000" stroke-width="10"/>
  <rect x="53" y="53" width="254" height="514" rx="44" fill="none" stroke="#FF6B6B" stroke-width="4"/>
