<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">How Redline works</title>
  <desc id="d">Two dashed zones, iPhone or simulator on the left and Mac on the right. On the left, your app&#39;s Debug build with the Redline kit inside. On the Mac, the Redline hub, a menu bar app with an inbox folder, and a Claude Code or Codex chat in your project. Four numbered arrows: 1, the chat registers its app with the hub; 2, the hub gives the app the Mac&#39;s address and a token; 3, the app sends a report to the hub; 4, the hub hands the report and its snapshots to the chat.</desc>
  <rect x="0" y="0" width="960" height="560" rx="24" fill="#F2F2F7"/>
  <!-- Zones -->
  <rect x="24" y="24" width="240" height="512" rx="20" fill="none" stroke="#8E8E93" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="44" y="60" font-size="20" font-weight="600" fill="#6E6E73">iPhone or simulator</text>
  <rect x="304" y="24" width="632" height="512" rx="20" fill="none" stroke="#8E8E93" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="324" y="60" font-size="20" font-weight="600" fill="#6E6E73">Mac</text>
  <!-- Legend -->
  <line x1="600" y1="54" x2="636" y2="54" stroke="#000000" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="644" y="60" font-size="20" fill="#6E6E73">setup</text>
  <line x1="720" y1="54" x2="756" y2="54" stroke="#000000" stroke-width="3"/>
  <text x="764" y="60" font-size="20" fill="#6E6E73">each report</text>
  <!-- Arrows: setup along the top (dashed), each report along the bottom (solid) -->
  <line x1="736" y1="220" x2="690" y2="220" stroke="#000000" stroke-width="3" stroke-linecap="butt" stroke-dasharray="7 6"/>
  <line x1="650" y1="220" x2="620" y2="220" stroke="#000000" stroke-width="3" stroke-linecap="butt" stroke-dasharray="6 6"/>
  <path d="M620 214 L606 220 L620 226 Z" fill="#000000"/>
  <line x1="424" y1="220" x2="354" y2="220" stroke="#000000" stroke-width="3" stroke-linecap="butt" stroke-dasharray="9.2 6"/>
  <line x1="314" y1="220" x2="260" y2="220" stroke="#000000" stroke-width="3" stroke-linecap="butt" stroke-dasharray="9 6"/>
  <path d="M260 214 L246 220 L260 226 Z" fill="#000000"/>
  <line x1="244" y1="400" x2="408" y2="400" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M408 394 L422 400 L408 406 Z" fill="#000000"/>
  <line x1="604" y1="400" x2="720" y2="400" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M720 394 L734 400 L720 406 Z" fill="#000000"/>
  <!-- Your app -->
  <rect x="44" y="120" width="200" height="380" rx="18" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <rect x="121.6" y="146" width="44.8" height="80" rx="9.6" fill="none" stroke="#000000" stroke-width="4"/>
  <rect x="131.2" y="163.6" width="25.6" height="6.4" rx="3.2" fill="#E5E5EA"/>
  <rect x="131.2" y="182.8" width="25.6" height="11.2" rx="3.2" fill="#000000"/>
  <rect x="128" y="179.6" width="32" height="17.6" rx="4.8" fill="none" stroke="#FF3B30" stroke-width="2.4"/>
  <rect x="131.2" y="205.2" width="19.2" height="6.4" rx="3.2" fill="#E5E5EA"/>
  <circle cx="128" cy="179.6" r="5.6" fill="#FF3B30" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="144" y="264" font-size="26" font-weight="600" fill="#000000" text-anchor="middle">Your app</text>
  <text x="144" y="292" font-size="20" fill="#6E6E73" text-anchor="middle">Debug build</text>
  <rect x="64" y="380" width="160" height="92" rx="14" fill="#F2F2F7"/>
  <text x="144" y="418" font-size="22" font-weight="600" fill="#000000" text-anchor="middle">Redline kit</text>
  <text x="144" y="446" font-size="20" fill="#6E6E73" text-anchor="middle">.redline()</text>
  <!-- Redline hub -->
  <rect x="424" y="120" width="180" height="380" rx="18" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <rect x="478" y="150" width="72" height="72" rx="16.6" fill="#111111" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
  <rect x="497.4" y="158.4" width="33.2" height="55.2" rx="8.4" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  <rect x="503.5" y="180.4" width="21" height="9.8" rx="2.1" fill="#FFFFFF"/>
  <rect x="501.1" y="178" width="25.9" height="14.7" rx="3.5" fill="none" stroke="#FF3B30" stroke-width="2.6"/>
  <circle cx="526.9" cy="178" r="8.4" fill="#1A1A1A"/>
  <circle cx="526.9" cy="178" r="6.6" fill="#FF3B30"/>
  <text x="514" y="264" font-size="26" font-weight="600" fill="#000000" text-anchor="middle">Redline hub</text>
  <text x="514" y="292" font-size="20" fill="#6E6E73" text-anchor="middle">Menu bar app</text>
  <rect x="444" y="380" width="140" height="92" rx="14" fill="#F2F2F7"/>
  <text x="514" y="418" font-size="22" font-weight="600" fill="#000000" text-anchor="middle">Inbox</text>
  <text x="514" y="446" font-size="20" fill="#6E6E73" text-anchor="middle">folder</text>
  <!-- Chat -->
  <rect x="736" y="120" width="180" height="380" rx="18" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <path d="M806 156 H846 A12 12 0 0 1 858 168 V190 A12 12 0 0 1 846 202 H820 L804 214 L806 202 A12 12 0 0 1 794 190 V168 A12 12 0 0 1 806 156 Z" fill="none" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <rect x="808" y="170" width="36" height="6" rx="3" fill="#E5E5EA"/>
  <rect x="808" y="183" width="24" height="6" rx="3" fill="#E5E5EA"/>
  <text x="826" y="264" font-size="26" font-weight="600" fill="#000000" text-anchor="middle">Chat</text>
  <text x="826" y="292" font-size="20" fill="#6E6E73" text-anchor="middle">in your project</text>
  <rect x="748" y="380" width="156" height="92" rx="14" fill="#F2F2F7"/>
  <text x="826" y="418" font-size="22" font-weight="600" fill="#000000" text-anchor="middle">Claude Code</text>
  <text x="826" y="446" font-size="20" fill="#6E6E73" text-anchor="middle">or Codex</text>
  <!-- Step labels and numbers -->
  <text x="670" y="168" font-size="20" font-weight="600" fill="#000000" text-anchor="middle">Registers</text>
  <text x="670" y="192" font-size="20" font-weight="600" fill="#000000" text-anchor="middle">its app</text>
  <text x="334" y="168" font-size="20" font-weight="600" fill="#000000" text-anchor="middle" stroke="#F2F2F7" stroke-width="6" stroke-linejoin="round" paint-order="stroke">Address</text>
  <text x="334" y="192" font-size="20" font-weight="600" fill="#000000" text-anchor="middle" stroke="#F2F2F7" stroke-width="6" stroke-linejoin="round" paint-order="stroke">and token</text>
  <text x="334" y="372" font-size="20" font-weight="600" fill="#000000" text-anchor="middle" stroke="#F2F2F7" stroke-width="6" stroke-linejoin="round" paint-order="stroke">Report</text>
  <text x="670" y="348" font-size="20" font-weight="600" fill="#000000" text-anchor="middle">Report and</text>
  <text x="670" y="372" font-size="20" font-weight="600" fill="#000000" text-anchor="middle">snapshots</text>
  <circle cx="670" cy="220" r="20" fill="#F2F2F7"/>
  <circle cx="670" cy="220" r="16" fill="#000000"/>
  <text x="670" y="227" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <circle cx="334" cy="220" r="20" fill="#F2F2F7"/>
  <circle cx="334" cy="220" r="16" fill="#000000"/>
  <text x="334" y="227" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <circle cx="334" cy="400" r="20" fill="#F2F2F7"/>
  <circle cx="334" cy="400" r="16" fill="#000000"/>
  <text x="334" y="407" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <circle cx="670" cy="400" r="20" fill="#F2F2F7"/>
  <circle cx="670" cy="400" r="16" fill="#000000"/>
  <text x="670" y="407" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
</svg>
