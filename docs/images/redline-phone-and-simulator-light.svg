  <title id="t">Steps 2 and 3 on an iPhone and in a simulator</title>
  <desc id="d">Steps 2 and 3, drawn twice. Physical iPhone: the hub, on the Mac, puts hub.json in the app over Xcode&#39;s device link, and the app sends the report to the hub over the local network. Simulator: the app and the hub are both on the Mac; the hub writes hub.json with 127.0.0.1, used only to list chats, and copies the finished report from the app&#39;s folder itself.</desc>
